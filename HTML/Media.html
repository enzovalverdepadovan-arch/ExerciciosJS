<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Média</title>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 520px;">
            <div class="card-body p-4">
                <h1 class="card-title text-center mb-4">Média</h1>

                <div class="mb-3">
                    <label for="nota1" class="form-label">Nota 1:</label>
                    <input type="number" class="form-control" id="nota1" step="0.1">
                </div>

                <div class="mb-3">
                    <label for="nota2" class="form-label">Nota 2:</label>
                    <input type="number" class="form-control" id="nota2" step="0.1">
                </div>

                <div class="mb-3">
                    <label for="nota3" class="form-label">Nota 3:</label>
                    <input type="number" class="form-control" id="nota3" step="0.1">
                </div>

                <div class="mb-3">
                    <label for="nota4" class="form-label">Nota 4:</label>
                    <input type="number" class="form-control" id="nota4" step="0.1">
                </div>

                <button class="btn btn-primary w-100" onclick="(() => {
                    const originalPrompt = window.prompt;
                    const respostas = [
                        document.getElementById('nota1').value,
                        document.getElementById('nota2').value,
                        document.getElementById('nota3').value,
                        document.getElementById('nota4').value
                    ];
                    window.prompt = () => respostas.shift();
                    try { media(); } finally { window.prompt = originalPrompt; }
                })()">Executar</button>
                <div id="resultado" class="alert alert-info mt-3 mb-0">Resultado aparecerá aqui.</div>
                <a href="../index.html" class="btn btn-outline-secondary w-100 mt-3">Voltar para a página inicial</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/funcoes.js"></script>
</body>
</html>
