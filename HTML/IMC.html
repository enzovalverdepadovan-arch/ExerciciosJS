<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>IMC</title>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 520px;">
            <div class="card-body p-4">
                <h1 class="card-title text-center mb-4">IMC</h1>

                <div class="mb-3">
                    <label for="alturaImc" class="form-label">Altura:</label>
                    <input type="number" class="form-control" id="alturaImc" step="0.01">
                </div>

                <div class="mb-3">
                    <label for="pesoImc" class="form-label">Peso:</label>
                    <input type="number" class="form-control" id="pesoImc" step="0.01">
                </div>

                <button class="btn btn-primary w-100" onclick="(() => {
                    const originalPrompt = window.prompt;
                    const respostas = [
                        document.getElementById('alturaImc').value,
                        document.getElementById('pesoImc').value
                    ];
                    window.prompt = () => respostas.shift();
                    try { imc(); } finally { window.prompt = originalPrompt; }
                })()">Executar</button>
                <div id="resultado" class="alert alert-info mt-3 mb-0">Resultado aparecerá aqui.</div>
                <a href="../index.html" class="btn btn-outline-secondary w-100 mt-3">Voltar para a página inicial</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/funcoes.js"></script>
</body>
</html>
