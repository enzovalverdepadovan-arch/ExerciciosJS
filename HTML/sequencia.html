<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Sequência</title>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 720px;">
            <div class="card-body p-4">
                <h1 class="card-title text-center mb-4">Verificar sequência</h1>

                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="numeroParaVerificar" class="form-label">Insira um número:</label>
                        <input type="number" class="form-control" id="numeroParaVerificar">
                    </div>
                </div>

                <div class="mt-4">
                    <h5 class="mb-3">Insira os 10 números da sequência:</h5>
                </div>

                <div class="row g-3">
                    <div class="col-md-6"><label for="numeroSequencia1" class="form-label">Número 1:</label><input type="number" class="form-control" id="numeroSequencia1"></div>
                    <div class="col-md-6"><label for="numeroSequencia2" class="form-label">Número 2:</label><input type="number" class="form-control" id="numeroSequencia2"></div>
                    <div class="col-md-6"><label for="numeroSequencia3" class="form-label">Número 3:</label><input type="number" class="form-control" id="numeroSequencia3"></div>
                    <div class="col-md-6"><label for="numeroSequencia4" class="form-label">Número 4:</label><input type="number" class="form-control" id="numeroSequencia4"></div>
                    <div class="col-md-6"><label for="numeroSequencia5" class="form-label">Número 5:</label><input type="number" class="form-control" id="numeroSequencia5"></div>
                    <div class="col-md-6"><label for="numeroSequencia6" class="form-label">Número 6:</label><input type="number" class="form-control" id="numeroSequencia6"></div>
                    <div class="col-md-6"><label for="numeroSequencia7" class="form-label">Número 7:</label><input type="number" class="form-control" id="numeroSequencia7"></div>
                    <div class="col-md-6"><label for="numeroSequencia8" class="form-label">Número 8:</label><input type="number" class="form-control" id="numeroSequencia8"></div>
                    <div class="col-md-6"><label for="numeroSequencia9" class="form-label">Número 9:</label><input type="number" class="form-control" id="numeroSequencia9"></div>
                    <div class="col-md-6"><label for="numeroSequencia10" class="form-label">Número 10:</label><input type="number" class="form-control" id="numeroSequencia10"></div>
                </div>

                <button class="btn btn-primary w-100 mt-4" onclick="sequencia()">Executar</button>
                <div id="resultado" class="alert alert-info mt-3 mb-0">Resultado aparecerá aqui.</div>
                <a href="../index.html" class="btn btn-outline-secondary w-100 mt-3">Voltar para a página inicial</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/funcoes.js"></script>
</body>
</html>
